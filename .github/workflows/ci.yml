name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  reader-service-tests:
    name: reader-service tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r apps/reader-service/requirements.txt \
            -r apps/reader-service/requirements-dev.txt

      - name: Run pytest
        working-directory: apps/reader-service
        run: pytest

  backend-tests:
    name: backend tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r apps/backend/requirements.txt \
            -r apps/backend/requirements-dev.txt

      - name: Run pytest
        working-directory: apps/backend
        run: pytest

  desktop-tests:
    name: desktop tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r apps/desktop/requirements.txt \
            -r apps/desktop/requirements-dev.txt \
            -r apps/backend/requirements.txt

      - name: Run pytest
        working-directory: apps/desktop
        run: pytest

  # Exercises the Windows-only code paths (msvcrt lock, Job Object,
  # CREATE_NO_WINDOW, registry lookups) and runs the headless self-test from
  # source. The frozen exe is self-tested in release.yml.
  desktop-tests-windows:
    name: desktop tests + self-test (Windows, Python 3.12)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/desktop/requirements.txt -r apps/desktop/requirements-dev.txt -r apps/backend/requirements.txt -r apps/reader-service/requirements.txt

      - name: Run pytest
        working-directory: apps/desktop
        shell: pwsh
        run: pytest

      # The self-test does not load the GUI stack. Importing it here loads
      # pythonnet (Python.Runtime.dll via clr_loader) and the WebView2 interop
      # DLLs without opening a window, so a broken pywebview/pythonnet release
      # shows up on the next push instead of only in a tag build.
      - name: Check GUI stack imports
        shell: python
        run: |
          from importlib.metadata import version

          import clr  # noqa: F401  (pythonnet)
          import webview.platforms.winforms  # noqa: F401
          import webview.platforms.edgechromium  # noqa: F401

          for dist in ("pywebview", "pythonnet", "clr_loader"):
              print(f"{dist} {version(dist)}")
          print("GUI stack imports OK")

      - name: Self-test from source
        working-directory: apps/desktop
        shell: pwsh
        timeout-minutes: 3
        env:
          RACETAG_LOG_DIR: ${{ runner.temp }}\racetag-selftest-logs
          # Crash dialogs are logged instead of shown; nothing can block the runner.
          RACETAG_NO_DIALOGS: "1"
        run: python app.py --selftest

      - name: Show self-test logs
        if: failure()
        shell: pwsh
        env:
          RACETAG_LOG_DIR: ${{ runner.temp }}\racetag-selftest-logs
        run: |
          $logs = @(Get-ChildItem -Path $env:RACETAG_LOG_DIR -Recurse -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) { Write-Host "No log files in $env:RACETAG_LOG_DIR" }
          foreach ($log in $logs) {
            Write-Host "===== $($log.FullName)"
            Get-Content -Path $log.FullName
          }
