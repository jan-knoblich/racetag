<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Racetag Live</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Racetag Live</h1>
      <div class="controls">
        <label>Backend URL
          <input id="backendUrl" type="text" />
        </label>
        <button id="connectBtn">Connect</button>
        <input id="csvFile" type="file" accept=".csv" style="display: none;" />
        <button id="importCsvBtn">Import CSV</button>
        <!-- W-012: Register rider button -->
        <button id="coupleTagBtn">Couple tag &#x2192; rider</button>
        <!-- Multi-race: race selector + create -->
        <label class="toggle-control race-select-control">
          Race:
          <select id="raceSelect"></select>
          <button id="newRaceBtn" title="Create a new race">+</button>
        </label>
        <!-- Race start (explicit-start model) -->
        <button id="startRaceBtn" class="btn-primary">Start race</button>
        <!-- End race (multi-race) -->
        <button id="endRaceBtn" class="btn-warn">End race</button>
        <!-- Export CSV results -->
        <button id="exportCsvBtn">Export results</button>
        <!-- W-036: Reset race -->
        <button id="resetRaceBtn" class="btn-warn">Reset race</button>
        <!-- W-074: Settings -->
        <button id="settingsBtn" class="btn-icon" title="Settings" aria-label="Open settings">&#9881;</button>
        <!-- W-036: Total laps -->
        <label class="toggle-control laps-control">
          Total laps:
          <input id="totalLapsInput" type="number" min="1" max="999" value="5" />
          <button id="applyLapsBtn">Apply</button>
        </label>
        <label class="toggle-control">
          <input id="tagColumnToggle" type="checkbox" checked />
          Show Tag
        </label>
      </div>
      <div class="status" id="status">Disconnected</div>
      <div class="race-status" id="raceStatus">Race: not started</div>
    </header>

    <main>
      <!-- W-013: CSV import errors collapsible -->
      <div id="importErrors" hidden>
        <button id="importErrorsToggle" class="import-errors-toggle">Show import errors</button>
        <ul id="importErrorList" class="import-error-list" hidden></ul>
      </div>

      <section>
        <h2>Standings</h2>
        <table id="standingsTable">
          <thead>
            <tr>
              <th>#</th>
              <th class="tag-col">Tag</th>
              <th>Bib</th>
              <th>Name</th>
              <th>Laps</th>
              <th>Finished</th>
              <th>Last pass</th>
              <th>Gap</th>
              <th>Total time (s)</th>
              <th>Laps&nbsp;±</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- W-051: Antenna diagnostics panel (collapsed by default) -->
      <details id="diagnosticsPanel" class="diagnostics-panel">
        <summary>Antenna diagnostics</summary>
        <div class="diagnostics-body">
          <table id="diagnosticsTable">
            <thead>
              <tr>
                <th>Antenna</th>
                <th>Reads (last 60 s)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </main>

    <!-- W-012: Register rider modal
         DOM structure:
           #registerModal (backdrop, role=dialog, aria-modal=true)
             .modal-box
               h2 "Register rider"
               .modal-field  label + #modalTagId (readonly)
               .modal-field  label + #modalBib (number input)
               .modal-field  label + #modalName (text input)
               #modalError   (hidden error banner)
               .modal-actions
                 #modalSaveBtn
                 #modalCancelBtn
                 #modalRetryBtn (hidden until 401)
    -->
    <div id="registerModal" class="modal-backdrop" role="dialog" aria-modal="true"
         aria-labelledby="registerModalTitle" hidden>
      <div class="modal-box">
        <h2 id="registerModalTitle" class="modal-title">Register rider</h2>

        <div class="modal-field">
          <label for="modalTagId">Tag ID</label>
          <input id="modalTagId" type="text" readonly />
        </div>

        <div class="modal-field">
          <label for="modalBib">Bib number</label>
          <input id="modalBib" type="number" min="1" placeholder="e.g. 42" />
        </div>

        <div class="modal-field">
          <label for="modalName">Rider name</label>
          <input id="modalName" type="text" placeholder="e.g. Jane Doe" />
        </div>

        <div id="modalError" class="modal-error" hidden></div>

        <div class="modal-actions">
          <button id="modalSaveBtn" class="btn-primary">Save</button>
          <button id="modalCancelBtn">Cancel</button>
          <button id="modalRetryBtn" class="btn-warn" hidden>Retry</button>
        </div>
      </div>
    </div>

    <!-- Multi-race: create-race modal -->
    <div id="newRaceModal" class="modal-backdrop" role="dialog" aria-modal="true"
         aria-labelledby="newRaceModalTitle" hidden>
      <div class="modal-box">
        <h2 id="newRaceModalTitle" class="modal-title">Create race</h2>

        <div class="modal-field">
          <label for="newRaceName">Race name</label>
          <input id="newRaceName" type="text" placeholder="e.g. Volksradrennen Sonntag" />
        </div>

        <div class="modal-field">
          <label for="newRaceScheduled">Scheduled date / time</label>
          <input id="newRaceScheduled" type="datetime-local" />
        </div>

        <div class="modal-field">
          <label for="newRaceFormat">Race format</label>
          <select id="newRaceFormat">
            <option value="laps" selected>Fixed laps</option>
            <option value="time">Time + final laps</option>
          </select>
        </div>

        <div class="modal-field" id="newRaceLapsField">
          <label for="newRaceTotalLaps">Total laps</label>
          <input id="newRaceTotalLaps" type="number" min="1" max="999" value="5" />
        </div>

        <div class="modal-field" id="newRaceDurationField" hidden>
          <label for="newRaceDurationMin">Duration (minutes)</label>
          <input id="newRaceDurationMin" type="number" min="1" max="1440" value="30" />
        </div>

        <div class="modal-field" id="newRaceFinalLapsField" hidden>
          <label for="newRaceFinalLaps">Final laps after the bell</label>
          <input id="newRaceFinalLaps" type="number" min="0" max="99" value="3" />
        </div>

        <div class="modal-checkbox-row">
          <input id="newRacePerRider" type="checkbox" />
          <label for="newRacePerRider">
            Per-rider finish (each finishes independently — off = criterium)
          </label>
        </div>

        <div class="modal-field">
          <label for="newRaceSnapshotInterval">
            Auto-snapshot interval (seconds) &mdash; 0 disables
          </label>
          <input id="newRaceSnapshotInterval" type="number" min="0" max="3600" value="120" />
        </div>

        <div class="modal-checkbox-row">
          <input id="newRaceActivate" type="checkbox" checked />
          <label for="newRaceActivate">Activate this race after creating</label>
        </div>

        <div id="newRaceError" class="modal-error" hidden></div>

        <div class="modal-actions">
          <button id="newRaceSaveBtn" class="btn-primary">Create</button>
          <button id="newRaceCancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- W-074: Settings modal
         Fields: Reader IP, Minimum lap interval, Total laps.
         DOM structure mirrors W-012 register-rider modal.
    -->
    <div id="settingsModal" class="modal-backdrop" role="dialog" aria-modal="true"
         aria-labelledby="settingsModalTitle" hidden>
      <div class="modal-box">
        <h2 id="settingsModalTitle" class="modal-title">Settings</h2>

        <div class="modal-field">
          <label for="settingsReaderIp">Reader IP</label>
          <input id="settingsReaderIp" type="text" placeholder="e.g. 192.168.1.100" />
        </div>

        <div class="modal-field">
          <label for="settingsMinLap">Minimum lap interval (s)</label>
          <input id="settingsMinLap" type="number" min="0" max="60" step="0.5" placeholder="8.0" />
        </div>

        <div class="modal-field">
          <label for="settingsTotalLaps">Total laps</label>
          <input id="settingsTotalLaps" type="number" min="1" max="999" step="1" placeholder="5" />
        </div>

        <div class="modal-field">
          <label for="settingsSnapshotInterval">
            Auto-snapshot interval (s) &mdash; active race; 0 disables
          </label>
          <input id="settingsSnapshotInterval" type="number" min="0" max="3600" step="1" placeholder="120" />
        </div>

        <div id="settingsError" class="modal-error" hidden></div>

        <div class="modal-actions">
          <button id="settingsSaveBtn" class="btn-primary">Save</button>
          <button id="settingsCancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Manual lap correction modal — opened by ✎ button per standings row. -->
    <div id="lapEditModal" class="modal-backdrop" role="dialog" aria-modal="true"
         aria-labelledby="lapEditModalTitle" hidden>
      <div class="modal-box">
        <h2 id="lapEditModalTitle" class="modal-title">Edit lap</h2>

        <div class="modal-field">
          <label>Rider</label>
          <input id="lapEditRider" type="text" readonly />
        </div>

        <div class="modal-field">
          <label>Current laps</label>
          <input id="lapEditCurrentLaps" type="text" readonly />
        </div>

        <div class="modal-field">
          <label for="lapEditTimestamp">
            Timestamp (UTC, leave empty for server now)
          </label>
          <input id="lapEditTimestamp" type="text"
                 placeholder="2026-06-25T18:30:00.000Z" />
        </div>

        <div class="modal-field">
          <label>Result status</label>
          <div class="status-actions">
            <button type="button" class="status-btn" data-status="dnf">DNF</button>
            <button type="button" class="status-btn" data-status="dns">DNS</button>
            <button type="button" class="status-btn" data-status="dsq">DSQ</button>
            <button type="button" class="status-btn" data-status="">Clear</button>
          </div>
        </div>

        <div id="lapEditError" class="modal-error" hidden></div>

        <div class="modal-actions">
          <button id="lapEditAddBtn" class="btn-primary">Add lap (+1)</button>
          <button id="lapEditRemoveBtn" class="btn-warn">Remove last lap (&minus;1)</button>
          <button id="lapEditCancelBtn">Close</button>
        </div>
      </div>
    </div>

    <!-- W-012: Toast notification container (bottom-right) -->
    <div id="toastContainer" class="toast" aria-live="polite" aria-atomic="true"></div>

    <script src="./api.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
